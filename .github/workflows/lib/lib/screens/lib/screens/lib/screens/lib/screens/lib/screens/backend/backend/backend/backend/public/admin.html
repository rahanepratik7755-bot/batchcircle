<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchCircle Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    .id-preview { max-width: 100px; border-radius: 6px; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="text-primary fw-bold mb-4">🎓 BatchCircle Admin Control</h2>
    <div class="card p-3 border-0 shadow-sm rounded-3">
      <h5 class="fw-bold mb-3">Pending ID Verifications</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>नाव</th>
              <th>कॉलेज व कोर्स</th>
              <th>आयडी</th>
              <th>कृती</th>
            </tr>
          </thead>
          <tbody id="vTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    async function load() {
      const res = await fetch('/api/admin/pending-verifications');
      const data = await res.json();
      const tbody = document.getElementById('vTable');
      tbody.innerHTML = '';
      data.forEach(u => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${u.name}</strong><br><small>${u.email}</small></td>
            <td>${u.college_name || 'N/A'}<br><span class="badge bg-secondary">${u.course_name}</span></td>
            <td><a href="${u.id_card_url}" target="_blank"><img src="${u.id_card_url}" class="id-preview border"></a></td>
            <td>
              <button class="btn btn-sm btn-success" onclick="act(${u.id}, 'approved')">Approve</button>
              <button class="btn btn-sm btn-danger" onclick="act(${u.id}, 'rejected')">Reject</button>
            </td>
          </tr>`;
      });
    }
    async function act(userId, status) {
      await fetch('/api/admin/verify-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, status })
      });
      load();
    }
    load();
  </script>
</body>
</html>
